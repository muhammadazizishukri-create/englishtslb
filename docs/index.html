</style></head><body><header><a class="brand" href="./"><span>♧</span><span>paws & poems<small>LITTLE VOICES, BIG IDEAS</small></span></a><nav><span class="pill">YEAR 5 ENGLISH</span></nav></header><main id="app"></main><footer>Made for curious minds. ♡ Paws & Poems · Year 5 English</footer><script>
const pet=(name)=>{
 const svg={Dog:'<ellipse cx="100" cy="140" rx="60" ry="12" fill="#dec9a5"/><path d="M64 52Q20 30 35 103L62 110M136 52Q180 30 165 103L138 110" fill="#9d6545"/><rect x="52" y="39" width="96" height="103" rx="42" fill="#c78b59"/><path d="M84 44Q76 76 90 90L110 90Q124 76 116 44" fill="#f9e3bc"/><ellipse cx="100" cy="110" rx="32" ry="24" fill="#f9e3bc"/><circle cx="76" cy="88" r="5"/><circle cx="124" cy="88" r="5"/><path d="M91 102Q100 96 109 102L100 112Z" fill="#443a33"/><path d="M100 113v10q-10 6-17-2m17 2q10 6 17-2" fill="none" stroke="#443a33" stroke-width="3"/><path d="M96 124v8q7 12 13 0v-8" fill="#e79894"/>',Cat:'<ellipse cx="100" cy="140" rx="57" ry="11" fill="#e2bdb4"/><path d="M51 75L49 25 86 47Q100 41 116 47L151 25 149 83" fill="#df9c6d"/><path d="M58 57L57 38 75 51M125 51L143 38 141 59" fill="#f3c4b0"/><ellipse cx="100" cy="92" rx="53" ry="48" fill="#df9c6d"/><path d="M89 46l6 20m10-20-1 20m13-18-6 19" stroke="#ad704c" stroke-width="5"/><path d="M70 89q7-10 14 0m32 0q7-10 14 0" fill="none" stroke="#503e34" stroke-width="4"/><path d="M94 103h12l-6 7Z" fill="#a95758"/><path d="M100 110v7m-16 0q8 9 16 0 8 9 16 0M43 101l32 5m-33 8 32-2m83-11-32 5m33 8-32-2" fill="none" stroke="#774f3a" stroke-width="2.5"/>',Bird:'<ellipse cx="100" cy="140" rx="48" ry="9" fill="#b6d1d5"/><path d="M98 128v14m18-15v15m-23 0h12m5 0h13" stroke="#ab8152" stroke-width="4"/><path d="M62 88L32 106 65 118" fill="#527f8b"/><ellipse cx="100" cy="91" rx="45" ry="43" fill="#79a9aa"/><circle cx="120" cy="61" r="29" fill="#79a9aa"/><path d="M145 62l21 8-22 10" fill="#e6b64d"/><circle cx="128" cy="58" r="5" fill="#273b39"/><path d="M83 74q-34 32 8 45 33-5 23-26" fill="#b4d1bb"/><path d="M107 36q-11-18-1-22 11 3 10 19" fill="#527f8b"/>',Fish:'<path d="M139 87l35-33q8 35 0 69l-36-24" fill="#df9863"/><ellipse cx="91" cy="89" rx="59" ry="39" fill="#efb65e"/><path d="M77 53q18-36 40-6m-40 79q22 28 42-2" fill="#df9863"/><path d="M101 70q-20 18 0 38l16-19Z" fill="#d99154"/><circle cx="57" cy="81" r="5" fill="#4d4439"/><path d="M35 95q12 8 18 0" fill="none" stroke="#a86843" stroke-width="3"/><circle cx="30" cy="40" r="8" fill="none" stroke="#c5d6ca" stroke-width="3"/><circle cx="15" cy="67" r="5" fill="none" stroke="#c5d6ca" stroke-width="3"/>'};
 return `<svg viewBox="0 0 200 160" role="img" aria-label="${name} illustration" xmlns="http://www.w3.org/2000/svg">${svg[name]}</svg>`;
};

const app=document.querySelector('#app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let stage=0,answers={name:'',class:'',favourite:'',disliked:'',likes:['','','',''],dislikes:['','']};
const animals=['Dog','Cat','Bird','Fish'];
function render(){
 const intro=`<div class="static-intro"><div class="eyebrow">A WORLD OF WORDS & WONDER</div><h1>Small paws.<br>Big imaginations.</h1><p class="muted">Choose your favourite animal, share your reasons, and let your English shine.</p><span class="pill">20–25 MINUTES · INDIVIDUAL ACTIVITY</span></div>`;
 app.innerHTML=intro+`<div class="worksheet" id="worksheet"></div>`;const box=document.querySelector('#worksheet');
 if(stage===0){box.innerHTML=`<div class="static-pets">${animals.map(n=>`<div class="pet">${pet(n)}<strong>${n}</strong></div>`).join('')}</div><section class="card"><h2>Your animal adventure starts here.</h2><p>Which animal would you like to have as a pet? Pick one, give four reasons why you like it, then explain why another animal is not for you.</p><p class="hint">This is a standalone activity. There are no accounts or online submissions. Your answers stay in this page until you leave or refresh it. Download or print your finished worksheet to share with your teacher.</p><button id="start">Start my activity →</button></section>`;document.querySelector('#start').onclick=()=>{stage=1;render();};return;}
 box.innerHTML=`<div class="steps"><span class="${stage===1?'active':''}">01 Choose an animal</span><span class="${stage===2?'active':''}">02 Share your reasons</span><span class="${stage===3?'active':''}">03 Review & download</span></div><div id="message" role="alert" class="message"></div><div id="content"></div>`;const content=document.querySelector('#content');
 if(stage===1){content.innerHTML=`<section class="card"><h2>A pet you’d love to have.</h2><p class="muted">Pick one favourite animal.</p><div class="choices">${animals.map(n=>`<button class="animal-choice" data-animal="${n}" aria-pressed="${answers.favourite===n}">${pet(n)}${n} ${answers.favourite===n?'✓':''}</button>`).join('')}</div><div class="actions"><button class="secondary" id="home">← Introduction</button><button id="next" ${answers.favourite?'':'disabled'}>Share my reasons →</button></div></section>`;document.querySelectorAll('[data-animal]').forEach(b=>b.onclick=()=>{answers.favourite=b.dataset.animal;if(answers.disliked===answers.favourite)answers.disliked='';render();});document.querySelector('#home').onclick=()=>{stage=0;render();};document.querySelector('#next').onclick=()=>{stage=2;render();};}
 if(stage===2){content.innerHTML=`<form id="reasons"><section class="card"><h2>A little about you</h2><p class="hint">Optional: add your name and class to your worksheet.</p><div class="identity"><div><label for="name">Your name</label><input id="name" maxlength="100" value="${esc(answers.name)}"></div><div><label for="class">Your class</label><input id="class" maxlength="60" value="${esc(answers.class)}"></div></div></section><section class="card"><span class="pill">MY FAVOURITE · ${answers.favourite}</span><h2>What makes this animal special?</h2><p class="muted">Give four different reasons. Use your own ideas.</p>${['I like this animal because…','I think this animal is…','It is…','I would like this animal because…'].map((s,i)=>`<label for="like${i}">Reason ${i+1}</label><textarea id="like${i}" required maxlength="1000" placeholder="${s}">${esc(answers.likes[i])}</textarea>`).join('')}</section><section class="card"><h2>Which pet isn’t for you?</h2><label for="disliked">Choose a different animal</label><select id="disliked" required><option value="">Choose an animal</option>${animals.filter(n=>n!==answers.favourite).map(n=>`<option ${n===answers.disliked?'selected':''}>${n}</option>`).join('')}</select>${['I dislike this animal because…','I would not choose this animal because…'].map((s,i)=>`<label for="dislike${i}">Reason ${i+1}</label><textarea id="dislike${i}" required maxlength="1000" placeholder="${s}">${esc(answers.dislikes[i])}</textarea>`).join('')}</section><div class="actions"><button id="back" type="button" class="secondary">← Choose an animal</button><button>Review my answers →</button></div></form>`;
 const collect=()=>{for(const key of ['name','class','disliked'])answers[key]=document.querySelector('#'+key).value.trim();answers.likes=answers.likes.map((_,i)=>document.querySelector('#like'+i).value.trim());answers.dislikes=answers.dislikes.map((_,i)=>document.querySelector('#dislike'+i).value.trim());};
 document.querySelector('#back').onclick=()=>{collect();stage=1;render();};document.querySelector('form').onsubmit=e=>{e.preventDefault();collect();if(!answers.disliked||answers.disliked===answers.favourite||[...answers.likes,...answers.dislikes].some(v=>!v)||new Set(answers.likes.map(v=>v.toLowerCase())).size!==4||new Set(answers.dislikes.map(v=>v.toLowerCase())).size!==2){document.querySelector('#message').textContent='Choose two different animals and fill every box with a different reason.';document.querySelector('#message').scrollIntoView();return;}stage=3;render();};}
 if(stage===3){content.innerHTML=`<section class="card"><span class="pill">MY COMPLETED WORKSHEET</span><h2>Choose your favourite animal</h2><p>${esc(answers.name)||'My animal adventure'}${answers.class?' · '+esc(answers.class):''}</p><p class="muted">Read through your answers, then download or print your worksheet. Give it to your teacher using the method they ask for.</p></section><div class="two-col"><section class="card"><span class="pill">MY FAVOURITE · ${answers.favourite}</span>${pet(answers.favourite)}<h3>Why I like this animal</h3><ol class="review-reasons">${answers.likes.map(r=>`<li>${esc(r)}</li>`).join('')}</ol></section><section class="card"><span class="pill">NOT MY CHOICE · ${answers.disliked}</span>${pet(answers.disliked)}<h3>Why I wouldn’t choose it</h3><ol class="review-reasons">${answers.dislikes.map(r=>`<li>${esc(r)}</li>`).join('')}</ol></section></div><div class="actions"><button class="secondary" id="edit">← Edit answers</button><button class="secondary" id="print">Print worksheet</button><button id="download">Download my answers ↓</button></div><p class="small-note">Your answers are not submitted online. Download them before closing or refreshing this page.</p>`;document.querySelectorAll('#content svg').forEach(s=>s.style.height='130px');document.querySelector('#edit').onclick=()=>{stage=2;render();};document.querySelector('#print').onclick=()=>window.print();document.querySelector('#download').onclick=()=>{const text=`PAWS & POEMS — CHOOSE YOUR FAVOURITE ANIMAL\nName: ${answers.name}\nClass: ${answers.class}\n\nMy favourite animal: ${answers.favourite}\n${answers.likes.map((r,i)=>`${i+1}. ${r}`).join('\n')}\n\nAnimal I would not choose: ${answers.disliked}\n${answers.dislikes.map((r,i)=>`${i+1}. ${r}`).join('\n')}\n`;const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='paws-and-poems-answers.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.querySelector('#message').className='message success';document.querySelector('#message').textContent='Your download is ready. Share the saved file with your teacher.';};}
}
render();
</script></body></html>
